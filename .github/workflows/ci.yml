name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    name: Required checks (same commit)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32
        with:
          go-version: 1.26.2
          cache-dependency-path: core/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.15.0
          cache: npm
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test contracts and extension
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          npm test --workspace packages/contracts
          npm run typecheck --workspace apps/extension
          npm test --workspace apps/extension
          npm run build --workspace apps/extension
      - name: Test Go core
        run: go test ./...
        working-directory: core
      - name: Test Java 8 runtime
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '8'
      - name: Verify and test agent on Java 8
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ((java -version 2>&1 | Select-Object -First 1) -notmatch '1\.8\.') { throw 'Expected Java 8 runtime.' }
          mvn -B -f java/pom.xml -pl agent,analyzer -am verify
          ./scripts/test-agent-smoke.ps1 -AgentJar java/agent/target/agent-0.1.0.jar -AgentSmokeClassPath java/agent/target/test-classes
          $psi = [Diagnostics.ProcessStartInfo]::new((Get-Command java).Source)
          $psi.ArgumentList.Add('-jar'); $psi.ArgumentList.Add((Resolve-Path java/analyzer/target/analyzer-0.1.0.jar).Path)
          $psi.RedirectStandardInput = $true; $psi.RedirectStandardOutput = $true; $psi.UseShellExecute = $false
          $process = [Diagnostics.Process]::Start($psi)
          $process.StandardInput.WriteLine('{"projectId":"smoke","revisionId":"smoke","artifacts":[{"id":"a1","path":"Sample.java","language":"java"}],"sources":{"Sample.java":"class Sample { void run() {} }"}}')
          $process.StandardInput.Close()
          $output = $process.StandardOutput.ReadToEnd(); $process.WaitForExit()
          $lines = @($output.TrimEnd("`r", "`n") -split "`r?`n")
          if ($process.ExitCode -ne 0 -or $lines.Count -ne 1) { throw 'Shaded analyzer JSONL smoke did not return exactly one result.' }
          $result = $lines[0] | ConvertFrom-Json
          if (@($result.symbols).Count -lt 1 -or @($result.PSObject.Properties.Name | Where-Object { $_ -in @('symbols','relations','evidence','diagnostics') }).Count -ne 4) { throw 'Shaded analyzer JSONL smoke returned an invalid AnalysisResult.' }
      - name: Test Java 21 runtime
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify and test agent on Java 21
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ((java -version 2>&1 | Select-Object -First 1) -notmatch '21\.') { throw 'Expected Java 21 runtime.' }
          mvn -B -f java/pom.xml -pl agent,analyzer -am verify
          ./scripts/test-agent-smoke.ps1 -AgentJar java/agent/target/agent-0.1.0.jar -AgentSmokeClassPath java/agent/target/test-classes
          $psi = [Diagnostics.ProcessStartInfo]::new((Get-Command java).Source)
          $psi.ArgumentList.Add('-jar'); $psi.ArgumentList.Add((Resolve-Path java/analyzer/target/analyzer-0.1.0.jar).Path)
          $psi.RedirectStandardInput = $true; $psi.RedirectStandardOutput = $true; $psi.UseShellExecute = $false
          $process = [Diagnostics.Process]::Start($psi)
          $process.StandardInput.WriteLine('{"projectId":"smoke","revisionId":"smoke","artifacts":[{"id":"a1","path":"Sample.java","language":"java"}],"sources":{"Sample.java":"class Sample { void run() {} }"}}')
          $process.StandardInput.Close()
          $output = $process.StandardOutput.ReadToEnd(); $process.WaitForExit()
          $lines = @($output.TrimEnd("`r", "`n") -split "`r?`n")
          if ($process.ExitCode -ne 0 -or $lines.Count -ne 1) { throw 'Shaded analyzer JSONL smoke did not return exactly one result.' }
          $result = $lines[0] | ConvertFrom-Json
          if (@($result.symbols).Count -lt 1 -or @($result.PSObject.Properties.Name | Where-Object { $_ -in @('symbols','relations','evidence','diagnostics') }).Count -ne 4) { throw 'Shaded analyzer JSONL smoke returned an invalid AnalysisResult.' }

  legacy-e2e:
    name: Legacy fixture and end-to-end browser flow
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32
        with:
          go-version: 1.26.2
          cache-dependency-path: core/go.sum
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.15.0
          cache: npm
      - name: Test legacy fixture and end-to-end browser flow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          mvn -B -f fixtures/legacy/pom.xml verify
          npm exec --workspace tests/e2e -- playwright install chromium
          npm test --workspace tests/e2e -- legacy-click.spec.ts

  modern-e2e:
    name: Jakarta fixture, click flow, and redeploy isolation
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32
        with:
          go-version: 1.26.2
          cache-dependency-path: core/go.sum
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.15.0
          cache: npm
      - name: Test modern fixture and browser flows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          mvn -B -f fixtures/modern/pom.xml clean verify
          npm exec --workspace tests/e2e -- playwright install chromium
          npm test --workspace tests/e2e -- modern-click.spec.ts
          npm test --workspace tests/e2e -- redeploy.spec.ts

  windows-package:
    name: Build Windows x64 package
    runs-on: windows-latest
    outputs:
      release-version: ${{ steps.release-version.outputs.version }}
    needs:
      - checks
      - legacy-e2e
      - modern-e2e
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32
        with:
          go-version: 1.26.2
          cache-dependency-path: core/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.15.0
          cache: npm
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install package dependencies
        shell: pwsh
        run: npm ci
      - name: Select date-based release version
        id: release-version
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDate = [DateTimeOffset]::UtcNow.ToOffset([TimeSpan]::FromHours(-3)).ToString('yyyyMMdd')
          $releaseTags = @(gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
          if ($LASTEXITCODE -ne 0) { throw 'Could not read existing GitHub Releases.' }
          $latestPatch = 0
          foreach ($tag in $releaseTags) {
            if ($tag -match "^$releaseDate\.(\d+)$") {
              $patch = [int]$Matches[1]
              if ($patch -gt $latestPatch) { $latestPatch = $patch }
            }
          }
          $version = "$releaseDate.$($latestPatch + 1)"
          "LEGACYLENS_RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Build Windows x64 package
        shell: pwsh
        run: ./scripts/verify.ps1 -Scope packaging -VerifiedChecks @('contracts','extension','core','java8-runtime','java8-agent-smoke','java8-analyzer-smoke','java21-runtime','java21-agent-smoke','java21-analyzer-smoke','legacy-fixture','legacy-e2e','modern-fixture','modern-e2e','redeploy')
      - name: Smoke packaged Java components on Java 8
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '8'
      - shell: pwsh
        run: ./scripts/test-package.ps1 -PackageDirectory artifacts/stage
      - shell: pwsh
        run: ./scripts/record-package-verification.ps1 -Check packaged-java8-smoke
      - name: Smoke packaged Java components on Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - shell: pwsh
        run: ./scripts/test-package.ps1 -PackageDirectory artifacts/stage
      - shell: pwsh
        run: ./scripts/record-package-verification.ps1 -Check packaged-java21-smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: legacylens-windows-x64-${{ github.sha }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    runs-on: windows-latest
    needs: windows-package
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: legacylens-windows-x64-${{ github.sha }}
          path: artifacts
      - name: Create tag and publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.windows-package.outputs.release-version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:RELEASE_VERSION -or $env:RELEASE_VERSION -notmatch '^\d{8}\.\d+$') {
            throw 'The date-based release version is missing or invalid.'
          }
          $zip = 'artifacts/legacylens-windows-x64.zip'
          $checksums = 'artifacts/SHA256SUMS.txt'
          if (-not (Test-Path $zip) -or -not (Test-Path $checksums)) {
            throw 'The verified Windows package or its checksums are missing.'
          }
          $checksumLine = (Get-Content $checksums -Raw).Trim()
          if ($checksumLine -notmatch '^([0-9a-fA-F]{64})\s+legacylens-windows-x64\.zip$') {
            throw 'Checksum file does not identify the expected package.'
          }
          $actualHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($Matches[1].ToLowerInvariant() -ne $actualHash) { throw 'Package SHA-256 does not match its checksum file.' }
          $expandedPath = Join-Path $env:RUNNER_TEMP 'legacylens-auto-release'
          Expand-Archive -LiteralPath $zip -DestinationPath $expandedPath -Force
          $manifestPath = Join-Path $expandedPath 'release-manifest.json'
          if (-not (Test-Path $manifestPath)) { throw 'Release manifest is missing from package.' }
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.version -ne $env:RELEASE_VERSION -or $manifest.commit -ne $env:GITHUB_SHA) {
            throw 'Package manifest does not match the release version and source commit.'
          }
          gh release create $env:RELEASE_VERSION $zip $checksums --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "LegacyLens $env:RELEASE_VERSION" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "Could not publish GitHub Release $env:RELEASE_VERSION." }
