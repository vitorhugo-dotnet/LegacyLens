name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    name: Required checks (same commit)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32
        with:
          go-version: 1.26.2
          cache-dependency-path: core/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.15.0
          cache: npm
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test contracts and extension
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          npm test --workspace packages/contracts
          npm run typecheck --workspace apps/extension
          npm test --workspace apps/extension
          npm run build --workspace apps/extension
      - name: Test Go core
        run: go test ./...
        working-directory: core
      - name: Test Java 8 runtime
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '8'
      - name: Verify and test agent on Java 8
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ((java -version 2>&1 | Select-Object -First 1) -notmatch '1\.8\.') { throw 'Expected Java 8 runtime.' }
          mvn -B -f java/pom.xml -pl agent,analyzer -am verify
          ./scripts/test-agent-smoke.ps1 -AgentJar java/agent/target/agent-0.1.0.jar -AgentSmokeClassPath java/agent/target/test-classes
          $psi = [Diagnostics.ProcessStartInfo]::new((Get-Command java).Source)
          $psi.ArgumentList.Add('-jar'); $psi.ArgumentList.Add((Resolve-Path java/analyzer/target/analyzer-0.1.0.jar).Path)
          $psi.RedirectStandardInput = $true; $psi.RedirectStandardOutput = $true; $psi.UseShellExecute = $false
          $process = [Diagnostics.Process]::Start($psi)
          $process.StandardInput.WriteLine('{"projectId":"smoke","revisionId":"smoke","artifacts":[{"id":"a1","path":"Sample.java","language":"java"}],"sources":{"Sample.java":"class Sample { void run() {} }"}}')
          $process.StandardInput.Close()
          $output = $process.StandardOutput.ReadToEnd(); $process.WaitForExit()
          $lines = @($output.TrimEnd("`r", "`n") -split "`r?`n")
          if ($process.ExitCode -ne 0 -or $lines.Count -ne 1) { throw 'Shaded analyzer JSONL smoke did not return exactly one result.' }
          $result = $lines[0] | ConvertFrom-Json
          if (@($result.symbols).Count -lt 1 -or @($result.PSObject.Properties.Name | Where-Object { $_ -in @('symbols','relations','evidence','diagnostics') }).Count -ne 4) { throw 'Shaded analyzer JSONL smoke returned an invalid AnalysisResult.' }
      - name: Test Java 21 runtime
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify and test agent on Java 21
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ((java -version 2>&1 | Select-Object -First 1) -notmatch '21\.') { throw 'Expected Java 21 runtime.' }
          mvn -B -f java/pom.xml -pl agent,analyzer -am verify
          ./scripts/test-agent-smoke.ps1 -AgentJar java/agent/target/agent-0.1.0.jar -AgentSmokeClassPath java/agent/target/test-classes
          $psi = [Diagnostics.ProcessStartInfo]::new((Get-Command java).Source)
          $psi.ArgumentList.Add('-jar'); $psi.ArgumentList.Add((Resolve-Path java/analyzer/target/analyzer-0.1.0.jar).Path)
          $psi.RedirectStandardInput = $true; $psi.RedirectStandardOutput = $true; $psi.UseShellExecute = $false
          $process = [Diagnostics.Process]::Start($psi)
          $process.StandardInput.WriteLine('{"projectId":"smoke","revisionId":"smoke","artifacts":[{"id":"a1","path":"Sample.java","language":"java"}],"sources":{"Sample.java":"class Sample { void run() {} }"}}')
          $process.StandardInput.Close()
          $output = $process.StandardOutput.ReadToEnd(); $process.WaitForExit()
          $lines = @($output.TrimEnd("`r", "`n") -split "`r?`n")
          if ($process.ExitCode -ne 0 -or $lines.Count -ne 1) { throw 'Shaded analyzer JSONL smoke did not return exactly one result.' }
          $result = $lines[0] | ConvertFrom-Json
          if (@($result.symbols).Count -lt 1 -or @($result.PSObject.Properties.Name | Where-Object { $_ -in @('symbols','relations','evidence','diagnostics') }).Count -ne 4) { throw 'Shaded analyzer JSONL smoke returned an invalid AnalysisResult.' }

  legacy-e2e:
    name: Legacy fixture and end-to-end browser flow
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32
        with:
          go-version: 1.26.2
          cache-dependency-path: core/go.sum
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.15.0
          cache: npm
      - name: Test legacy fixture and end-to-end browser flow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          mvn -B -f fixtures/legacy/pom.xml verify
          npm exec --workspace tests/e2e -- playwright install chromium
          npm test --workspace tests/e2e -- legacy-click.spec.ts

  modern-e2e:
    name: Jakarta fixture, click flow, and redeploy isolation
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32
        with:
          go-version: 1.26.2
          cache-dependency-path: core/go.sum
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.15.0
          cache: npm
      - name: Test modern fixture and browser flows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          mvn -B -f fixtures/modern/pom.xml clean verify
          npm exec --workspace tests/e2e -- playwright install chromium
          npm test --workspace tests/e2e -- modern-click.spec.ts
          npm test --workspace tests/e2e -- redeploy.spec.ts

  windows-package:
    name: Build Windows x64 package
    runs-on: windows-latest
    needs:
      - checks
      - legacy-e2e
      - modern-e2e
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32
        with:
          go-version: 1.26.2
          cache-dependency-path: core/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.15.0
          cache: npm
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install package dependencies
        shell: pwsh
        run: npm ci
      - name: Build Windows x64 package
        shell: pwsh
        run: ./scripts/verify.ps1 -Scope packaging -VerifiedChecks @('contracts','extension','core','java8-runtime','java8-agent-smoke','java8-analyzer-smoke','java21-runtime','java21-agent-smoke','java21-analyzer-smoke','legacy-fixture','legacy-e2e','modern-fixture','modern-e2e','redeploy')
      - name: Smoke packaged Java components on Java 8
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '8'
      - shell: pwsh
        run: ./scripts/test-package.ps1 -PackageDirectory artifacts/stage
      - shell: pwsh
        run: ./scripts/record-package-verification.ps1 -Check packaged-java8-smoke
      - name: Smoke packaged Java components on Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - shell: pwsh
        run: ./scripts/test-package.ps1 -PackageDirectory artifacts/stage
      - shell: pwsh
        run: ./scripts/record-package-verification.ps1 -Check packaged-java21-smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: legacylens-windows-x64-${{ github.sha }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
