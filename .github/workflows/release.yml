name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  required-checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    needs: required-checks
    if: ${{ always() && needs.required-checks.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: legacylens-windows-x64-${{ github.sha }}
          path: artifacts
      - name: Verify tag points to built commit
        shell: pwsh
        run: |
          $tagCommit = git rev-list -n 1 $env:GITHUB_REF
          if ($tagCommit -ne $env:GITHUB_SHA) { throw 'Tag SHA differs from checked and verified SHA.' }
          $zip = 'artifacts/legacylens-windows-x64.zip'
          $checksums = 'artifacts/SHA256SUMS.txt'
          if (-not (Test-Path $zip)) { throw 'Required Windows package is missing.' }
          if (-not (Test-Path $checksums)) { throw 'Package checksums are missing.' }
          $checksumLine = (Get-Content $checksums -Raw).Trim()
          if ($checksumLine -notmatch '^([0-9a-fA-F]{64})\s+legacylens-windows-x64\.zip$') { throw 'Checksum file does not identify the expected package.' }
          $expectedHash = $Matches[1].ToLowerInvariant()
          $actualHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expectedHash -notmatch '^[0-9a-f]{64}$' -or $expectedHash -ne $actualHash) { throw 'Package SHA-256 does not match its checksum file.' }
          $expandedPath = Join-Path $env:TEMP 'legacylens-release-assets'
          if (Test-Path $expandedPath) { Remove-Item -LiteralPath $expandedPath -Recurse -Force }
          Expand-Archive -LiteralPath $zip -DestinationPath $expandedPath -Force
          $manifestPath = Join-Path $expandedPath 'release-manifest.json'
          if (-not (Test-Path $manifestPath)) { throw 'Release manifest is missing from package.' }
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.commit -ne $env:GITHUB_SHA -or $manifest.version -ne $env:GITHUB_REF_NAME) { throw 'Manifest provenance does not match tag SHA and version.' }
          if ($manifest.protocolVersion -ne 1 -or $manifest.platform -ne 'windows/amd64') { throw 'Manifest protocol or platform is unsupported.' }
          if ($manifest.componentVersions.core -ne $env:GITHUB_SHA -or $manifest.componentVersions.nativeHost -ne $env:GITHUB_SHA) { throw 'Core and native-host provenance does not match the tag SHA.' }
          if (-not $manifest.componentVersions.extension -or -not $manifest.componentVersions.javaAgent -or -not $manifest.componentVersions.javaAnalyzer -or -not $manifest.componentVersions.javaRuntime -or -not $manifest.componentVersions.goToolchain -or -not $manifest.componentVersions.nodeToolchain) { throw 'Manifest is missing component or toolchain versions.' }
          [xml]$analyzerPom = Get-Content java/analyzer/pom.xml -Raw
          $analyzerVersion = $analyzerPom.project.parent.version
          if ($manifest.componentVersions.javaAnalyzer -ne $analyzerVersion) { throw 'Analyzer version does not match checked source provenance.' }
          if (-not (Test-Path (Join-Path $expandedPath 'analyzer/legacylens-analyzer.jar'))) { throw 'Packaged Java analyzer is missing.' }
          $extensionManifest = Get-Content (Join-Path $expandedPath 'extension/manifest.json') -Raw | ConvertFrom-Json
          if ($extensionManifest.version -ne $manifest.componentVersions.extension) { throw 'Extension manifest version does not match package provenance.' }
          $requiredChecks = @('contracts','extension','core','java8-runtime','java8-agent-smoke','java8-analyzer-smoke','java21-runtime','java21-agent-smoke','java21-analyzer-smoke','legacy-fixture','legacy-e2e','modern-fixture','modern-e2e','redeploy','packaged-core-smoke','packaged-agent-smoke','packaged-analyzer-smoke','packaged-java8-smoke','packaged-java21-smoke')
          foreach ($check in $requiredChecks) { if ($manifest.verificationResults.$check -ne 'passed') { throw "Required verification is missing or not passed: $check" } }
          if ($manifest.releasePrerequisites.task11JavaWorker -ne 'complete' -or $manifest.releasePrerequisites.task17ModernFixture -ne 'complete') { throw 'Release is blocked until Task11 Java worker and Task17 modern fixture assets and checks are complete.' }
          foreach ($asset in $manifest.releasePrerequisites.requiredAssets) { if (-not (Test-Path (Join-Path $expandedPath $asset))) { throw "Required release asset is missing: $asset" } }
          foreach ($file in @('legacylens.exe','legacylens-host.exe','agent/legacylens-agent.jar','analyzer/legacylens-analyzer.jar','extension/manifest.json','fixtures/modern/modern-fixture.war','fixtures/modern/fixture-lock.json','fixtures/modern/release-evidence.json','fixtures/modern/schema.sql','docs/release-manifest.schema.json','docs/windows-installation.md','scripts/install-native-host.ps1','scripts/uninstall-native-host.ps1','LICENSE','README.md')) { if (-not (Test-Path (Join-Path $expandedPath $file))) { throw "Package is missing required file: $file" } }
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME artifacts/legacylens-windows-x64.zip artifacts/SHA256SUMS.txt --verify-tag --title $env:GITHUB_REF_NAME --notes 'Verified reference stacks: Java 8 + WildFly 10 + Faces 2 + PrimeFaces 5 + MySQL 5; Java 21 + WildFly 35 + Faces 4 + PrimeFaces 15 Jakarta + MySQL 8.4. Windows 10 x64 validation remains pending on a separate machine. Other versions and application servers are not implied supported.'
