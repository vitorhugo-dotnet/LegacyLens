<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:p="http://primefaces.org/ui" xmlns:pt="jakarta.faces.passthrough">
<h:head><title>Modern orders fixture</title></h:head><h:body>
  <h:panelGroup id="runtimeInfo" layout="block" pt:data-java="#{orderBean.javaVersion}" pt:data-faces="#{orderBean.facesVersion}" pt:data-primefaces="#{orderBean.primeFacesVersion}" pt:data-mysql="#{orderBean.mysqlVersion}" pt:data-connector-j="#{orderBean.connectorJVersion}" pt:data-build-revision="#{orderBean.buildRevision}" />
  <h:form id="orderForm">
    <h:inputText id="note" value="#{orderBean.note}" />
    <p:commandButton id="saveOrder" value="Save order" actionListener="#{orderBean.save}" update="result" onclick="fetch('orders.xhtml');" />
    <h:panelGroup id="result"><h:outputText id="message" value="#{orderBean.message}" /><h:outputText id="count" value="#{orderBean.orderCount}" /></h:panelGroup>
  </h:form>
  <button type="button" id="domOnly" onclick="this.textContent='DOM changed'">DOM only</button>
  <script type="text/javascript">window.setInterval(function(){fetch('orders.xhtml');},750);</script>
</h:body></html>
